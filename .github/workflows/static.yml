name: Deploy Dogs Viewer App

on:
  push:
    branches: ["main"] # Спрацьовуватиме при кожному пуші в main

  # Дозволяє запускати workflow вручну зі вкладки Actions
  workflow_dispatch:

# Встановлюємо дозволи для GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяємо лише одне одночасне розгортання
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Вказуємо папку, яку згенерував Vite (для React це 'dist')
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
